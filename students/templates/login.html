<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMS | Sign In</title>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.3 & Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            margin: 0;
            position: relative;
            overflow-x: hidden;
        }

        /* Ambient Glow Circles in Background */
        body::before {
            content: '';
            position: absolute;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.25) 0%, rgba(99, 102, 241, 0) 70%);
            top: 10%;
            left: 15%;
            border-radius: 50%;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(14, 165, 233, 0.2) 0%, rgba(14, 165, 233, 0) 70%);
            bottom: 10%;
            right: 15%;
            border-radius: 50%;
            pointer-events: none;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 44px 38px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.45);
            position: relative;
            z-index: 1;
        }

        .brand-icon {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.6rem;
            box-shadow: 0 8px 18px rgba(79, 70, 229, 0.35);
            margin-bottom: 20px;
        }

        .login-title {
            font-size: 1.45rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: #0f172a;
            margin-bottom: 6px;
        }

        .login-subtitle {
            color: #64748b;
            font-size: 0.88rem;
            margin-bottom: 28px;
        }

        .form-control {
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 0.92rem;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.14);
        }

        .btn-signin {
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35);
            transition: all 0.2s ease;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-signin:hover {
            background: linear-gradient(135deg, #4338ca 0%, #3730a3 100%);
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.45);
            transform: translateY(-1px);
            color: white;
        }

        .demo-roles-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 12px;
            margin-top: 24px;
            font-size: 0.78rem;
            color: #64748b;
        }

        .demo-roles-card strong {
            color: #0f172a;
        }
    </style>
</head>

<body>
    <div class="login-card text-center">
        <div class="brand-icon">
            <i class="bi bi-mortarboard-fill"></i>
        </div>
        <h2 class="login-title">EduManage Portal</h2>
        <p class="login-subtitle">Sign in to your faculty, administrator, or student account</p>

        {% if error %}
        <div class="alert alert-danger d-flex align-items-center gap-2 p-3 mb-4 rounded-3 text-start small" role="alert">
            <i class="bi bi-exclamation-circle-fill"></i>
            <div>{{ error }}</div>
        </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3 text-start">
                <label class="form-label fw-semibold text-dark small">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0" style="border-radius: 12px 0 0 12px; border-color: #cbd5e1;">
                        <i class="bi bi-person text-muted"></i>
                    </span>
                    <input type="text" name="username" class="form-control border-start-0 ps-0" placeholder="e.g. teacher1 or anshika" style="border-radius: 0 12px 12px 0;" required>
                </div>
            </div>

            <div class="mb-4 text-start">
                <label class="form-label fw-semibold text-dark small">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0" style="border-radius: 12px 0 0 12px; border-color: #cbd5e1;">
                        <i class="bi bi-lock text-muted"></i>
                    </span>
                    <input type="password" name="password" class="form-control border-start-0 ps-0" placeholder="••••••••" style="border-radius: 0 12px 12px 0;" required>
                </div>
            </div>

            <button type="submit" class="btn btn-signin">
                <span>Sign In</span>
                <i class="bi bi-arrow-right"></i>
            </button>
        </form>

        <div class="demo-roles-card text-start">
            <div class="fw-bold mb-1" style="color: #475569;">Quick Credentials:</div>
            <div>• <strong>Teacher:</strong> <code>teacher1</code> / <code>password123</code></div>
            <div>• <strong>Admin:</strong> <code>admin_user1</code> / <code>password123</code></div>
            <div>• <strong>Student:</strong> <code>anshika</code> / <code>password123</code></div>
        </div>
    </div>
</body>

</html>
